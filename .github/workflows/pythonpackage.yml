name: Test PyGeoprocessing

on: [push, pull_request]

defaults:
  run:
    shell: bash -l {0}

jobs:
  Test:
    runs-on: ${{ matrix.os }}
    name: Test (py${{ matrix.python-version }}, GDAL ${{ matrix.gdal }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Covering all python versions currently supported by PSF.
        # NOTE: as of 2026-11-04, GDAL does not yet have a python 3.15 build
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Debian:stable (trixie) has gdal 3.10, so testing aginst at least GDAL 3.10
        gdal: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        # If there are specific version combinations to exclude, note them below.
        #exclude:  # Example
        #  - gdal: "3.6"
        #    python-version: 3.13

    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch all history so that setuptool_scm can build the correct
          # version string.
          fetch-depth: 0

      - name: setup-micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          # Grab requirements from pip-compatible requirements.txt
          environment-file: requirements.txt
          condarc: |
              channels:
                - conda-forge
          create-args: >-
              python=${{ matrix.python-version }}
              gdal=${{ matrix.gdal }}
              setuptools
              python-build
              flake8
              pytest
              numpy
          environment-name: pyenv

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127
          # chars wide
          flake8 . --count --exit-zero --max-complexity=10 \
            --max-line-length=127 --statistics

      - name: Build and Install PyGeoprocessing
        run: |
            PYGEOPROCESSING_GDAL_LIB_PATH="$CONDA_PREFIX/Library" python -m build --wheel --verbose
            python -m pip install $(find dist -name "*.whl")

      - name: Test with pytest
        run: python -m pytest tests
